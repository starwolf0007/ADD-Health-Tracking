# .github/workflows/test-build.yml
#
# Manually-triggered build of a signed test APK, distributed via Firebase App
# Distribution. Mirrors android-ci.yml's build/test steps and adds signing +
# distribution on top. main-only: no arbitrary-ref input, since secrets are
# involved.
#
# One-time setup this workflow depends on (not performed by CI):
#   - TEST_KEYSTORE_BASE64, TEST_KEYSTORE_PASSWORD, TEST_KEY_ALIAS secrets
#     (base64 of a stable .jks keystore generated locally with keytool)
#   - FIREBASE_APP_ID, FIREBASE_SERVICE_ACCOUNT_JSON secrets
#   - A "testers" group created in Firebase console > App Distribution
#   - GOOGLE_SERVICES_JSON secret (shared with android-ci.yml)
# See docs/test-build-pipeline.md for the full one-time setup runbook.

name: Build Test APK

on:
  workflow_dispatch:

jobs:
  build-and-distribute:
    name: Build & Distribute Test APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Restore google-services.json
        run: |
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift & Riverpod code
        run: dart run build_runner build --delete-conflicting-outputs -d

      - name: Run Flutter tests
        run: flutter test

      - name: Run Kotlin unit tests (Health Connect bridge)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Decode test keystore
        run: echo "${{ secrets.TEST_KEYSTORE_BASE64 }}" | base64 -d > android/app/neuroflow-test.jks

      - name: Build signed release APK
        env:
          TEST_KEYSTORE_PATH: android/app/neuroflow-test.jks
          TEST_KEYSTORE_PASSWORD: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
          TEST_KEY_ALIAS: ${{ secrets.TEST_KEY_ALIAS }}
        run: |
          flutter build apk --release \
            --build-number="${{ github.run_number }}" \
            --dart-define=BUILD_COMMIT=${{ github.sha }} \
            --dart-define=BUILD_DATE=$(date +%Y-%m-%d)

      - name: Locate built APK
        id: find_apk
        run: |
          APK_PATH=$(find build -name 'app-release.apk' | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "No app-release.apk found under build/" >&2
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          file: ${{ steps.find_apk.outputs.apk_path }}
          releaseNotes: |
            Commit: ${{ github.sha }}
            Run: ${{ github.run_number }}
